name: Tự động Build Tailwind CSS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Lấy mã nguồn
        uses: actions/checkout@v4

      - name: 2. Tải phần mềm Tailwind (Bỏ qua Node.js)
        run: |
          curl -sLO https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64
          chmod +x tailwindcss-linux-x64

      - name: 3. Chạy lệnh Build CSS
        run: ./tailwindcss-linux-x64 -i ./input.css -o ./style.css --minify

      - name: 4. Lưu file style.css lên Github
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add style.css
          git commit -m "Tự động tạo file style.css" || echo "Không có thay đổi"
          git push
