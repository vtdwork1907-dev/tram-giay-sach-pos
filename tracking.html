<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Tra Cứu Đơn Hàng - Trạm Giày Sạch</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://pub-d0286c0054894952a1babf1f9cc3e58d.r2.dev/uploads/1785661533368_ttzv4cr.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SUPABASE JS (Public Client) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: { extend: { colors: { navy: { 50: '#f0f5fa', 100: '#e1ebd5', 600: '#1d5494', 800: '#10386C', 900: '#0a2347' }, cyanBrand: '#00A8E8' } } }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Lexend', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .spinner { border: 4px solid #e2e8f0; border-top: 4px solid #0ea5e9; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <!-- MÀN HÌNH TẢI DỮ LIỆU -->
    <div id="loadingScreen" class="fixed inset-0 bg-white z-[9999] flex flex-col items-center justify-center">
        <div class="spinner mb-4"></div>
        <div class="text-sm font-bold text-slate-500 animate-pulse">Đang tra cứu đơn hàng...</div>
    </div>

    <!-- MÀN HÌNH XEM ẢNH TO -->
    <div id="imageViewerModal" class="fixed inset-0 bg-black/95 z-[9999] hidden flex-col items-center justify-center p-2 opacity-0 transition-opacity duration-300 select-none">
        <button onclick="closeImageViewer()" class="absolute top-6 right-6 text-white hover:text-red-400 text-3xl leading-none z-20 w-12 h-12 flex items-center justify-center bg-black/50 rounded-full cursor-pointer border border-white/20 shadow-lg">&times;</button>
        <img id="viewerImage" src="" class="max-w-full max-h-[85vh] object-contain rounded-lg transition-transform duration-300 scale-95 touch-none">
    </div>

    <!-- KHUNG CHÍNH -->
    <div class="w-full max-w-xl mx-auto md:my-8 bg-white md:rounded-3xl shadow-2xl border-x md:border border-slate-200 overflow-hidden min-h-screen md:min-h-0 flex flex-col">
        
        <!-- Header Cửa hàng -->
        <div class="bg-navy-800 text-white p-6 text-center relative shrink-0">
            <div class="w-16 h-16 bg-white text-navy-800 rounded-full flex items-center justify-center mx-auto shadow-lg mb-3 text-2xl font-bold overflow-hidden border-2 border-sky-400/30">
                <div id="trackingDefaultLogo" class="flex items-center justify-center w-full h-full"><i class="fa-solid fa-shoe-prints"></i></div>
                <img id="trackingCustomLogo" src="" class="hidden w-full h-full object-cover">
            </div>
            <h1 class="font-bold text-xl tracking-wider">TRẠM GIÀY SẠCH</h1>
            <p class="text-xs text-sky-200 mt-1">Hệ Thống Tra Cứu Dịch Vụ Khách Hàng</p>
        </div>
        
        <!-- Khu vực hiển thị nội dung -->
        <div class="p-5 md:p-6 space-y-6 flex-1 bg-slate-50" id="trackingContentBox">
            <!-- Dữ liệu sẽ được Javascript render vào đây -->
        </div>
        
        <!-- Footer -->
        <div class="bg-white p-4 text-center border-t border-slate-200 text-xs text-slate-500 font-medium shrink-0">
            Cảm ơn quý khách đã sử dụng dịch vụ tại Trạm Giày Sạch ❤️
        </div>
    </div>

    <script>
        // CHỈ SỬ DỤNG PUBLIC KEY CỦA SUPABASE - TUYỆT ĐỐI KHÔNG CHỨA SECRET KEY APP
        const SUPABASE_URL = 'https://hlmpqachgklowhozqbqj.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsbXBxYWNoZ2tsb3dob3pxYnFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NTA3NTksImV4cCI6MjEwMTIyNjc1OX0.9ZBOIqVvgvcPLDrIf_d4EV3KAlyPQnEsVTG3vU4hlAI';
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // HÀM BẢO MẬT: Escape HTML để chống XSS
        function escapeHTML(str) {
            if (!str) return '';
            return str.toString().replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
                }[tag] || tag)
            );
        }

        // ĐỊNH DẠNG TIỀN TỆ
        function formatMoney(amount) {
            return new Intl.NumberFormat('vi-VN').format(amount) + ' đ';
        }

        // XEM ẢNH FULLSCREEN
        function openImageViewer(url) {
            const modal = document.getElementById('imageViewerModal'); 
            const img = document.getElementById('viewerImage');
            img.src = url; 
            img.style.transform = 'scale(0.95)'; 
            modal.classList.remove('hidden'); 
            
            // Ép reflow để chạy animation
            void modal.offsetWidth; 
            modal.classList.remove('opacity-0'); 
            img.classList.remove('scale-95');
        }

        function closeImageViewer() {
            const modal = document.getElementById('imageViewerModal'); 
            const img = document.getElementById('viewerImage');
            modal.classList.add('opacity-0'); 
            img.style.transform = 'scale(0.9)';
            
            setTimeout(() => { 
                modal.classList.add('hidden'); 
                img.src = ''; 
                img.style.transform = ''; 
            }, 300);
        }

        // TẢI VÀ HIỂN THỊ DỮ LIỆU
        async function loadTrackingData() {
            const box = document.getElementById('trackingContentBox');
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('id');

            if (!orderId) {
                renderError('Không tìm thấy mã đơn hàng. Vui lòng kiểm tra lại đường link!');
                return;
            }

            try {
                // 1. Tải Logo cửa hàng (Nếu cho phép)
                const { data: settings } = await supabase.from('store_settings').select('logo').eq('id', 'main').single();
                if (settings && settings.logo) {
                    document.getElementById('trackingDefaultLogo').style.display = 'none';
                    const customLogo = document.getElementById('trackingCustomLogo');
                    customLogo.src = escapeHTML(settings.logo);
                    customLogo.style.display = 'block';
                }

                // 2. Tải đúng 1 đơn hàng dựa trên ID, chỉ lấy các trường cần thiết
                const { data: order, error } = await supabase
                    .from('orders')
                    .select('id, date, customer_name, customer_phone, items, images, images_after, total, status')
                    .eq('id', orderId)
                    .single();

                if (error || !order) {
                    renderError('Đơn hàng không tồn tại hoặc đã bị xóa khỏi hệ thống.');
                    return;
                }

                renderTrackingUI(order);

            } catch (err) {
                renderError('Đã xảy ra lỗi hệ thống khi tải dữ liệu.');
                console.error(err);
            } finally {
                // Tắt màn hình loading
                document.getElementById('loadingScreen').style.display = 'none';
            }
        }

        function renderError(message) {
            document.getElementById('loadingScreen').style.display = 'none';
            document.getElementById('trackingContentBox').innerHTML = `
                <div class="flex flex-col items-center justify-center text-center py-10">
                    <i class="fa-solid fa-triangle-exclamation text-red-400 text-5xl mb-4"></i>
                    <h2 class="font-bold text-slate-700 text-lg mb-2">Lỗi Tra Cứu</h2>
                    <p class="text-sm text-slate-500">${escapeHTML(message)}</p>
                </div>
            `;
        }

        function renderTrackingUI(order) {
            const box = document.getElementById('trackingContentBox');
            
            // Xử lý ẩn một phần số điện thoại khách hàng (Bảo mật)
            const rawPhone = escapeHTML(order.customer_phone || '');
            const maskedPhone = rawPhone.length > 4 ? rawPhone.substring(0, rawPhone.length - 3) + '***' : '***';

            // Xử lý luồng trạng thái
            const statusList = [
                { key: 'RECEIVED', label: 'Đã nhận', icon: 'fa-box', desc: 'Đã nhận giày từ khách' },
                { key: 'PROCESSING', label: 'Đang xử lý', icon: 'fa-clock-rotate-left', desc: 'Đang tiến hành Spa giày' },
                { key: 'PROCESSED', label: 'Đã làm xong', icon: 'fa-check-circle', desc: 'Đã hoàn thành dịch vụ' }
            ];

            let currentStepIdx = 0;
            if (['PROCESSING'].includes(order.status)) currentStepIdx = 1;
            else if (['PROCESSED', 'PAID', 'DELIVERED'].includes(order.status)) currentStepIdx = 2;
            const isCompleted = currentStepIdx === 2;

            let stepsHtml = statusList.map((st, idx) => {
                const isDone = idx <= currentStepIdx;
                return `
                    <div class="flex items-center gap-4 relative">
                        ${idx < statusList.length - 1 ? `<div class="absolute left-6 top-10 w-0.5 h-6 ${idx < currentStepIdx ? 'bg-emerald-400' : 'bg-slate-200'}"></div>` : ''}
                        <div class="w-12 h-12 rounded-full flex items-center justify-center font-bold text-lg shrink-0 transition-colors z-10 ${isDone ? 'bg-emerald-500 text-white shadow-lg' : 'bg-slate-200 text-slate-400'}">
                            <i class="fa-solid ${st.icon}"></i>
                        </div>
                        <div class="flex-1">
                            <div class="font-bold text-sm ${isDone ? 'text-slate-800' : 'text-slate-400'}">${st.label}</div>
                            <div class="text-[11px] ${isDone ? 'text-slate-500' : 'text-slate-400'}">${st.desc}</div>
                        </div>
                    </div>`;
            }).join('<div class="h-4"></div>'); // Khoảng cách giữa các bước

            // Xử lý danh sách dịch vụ
            let detailedItemsHtml = (order.items || []).map(item => {
                let st = item.status || 'RECEIVED'; 
                let badge = '';
                if (st === 'RECEIVED') badge = '<span class="text-[10px] bg-slate-100 text-slate-600 border border-slate-200 px-2 py-1 rounded-md font-bold shadow-sm">Đã nhận</span>';
                if (st === 'PROCESSING') badge = '<span class="text-[10px] bg-amber-50 text-amber-700 border border-amber-200 px-2 py-1 rounded-md font-bold shadow-sm">Đang làm</span>';
                if (st === 'PROCESSED') badge = '<span class="text-[10px] bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-1 rounded-md font-bold shadow-sm">Đã xong</span>';
                
                return `<div class="flex justify-between items-center bg-white p-3.5 rounded-xl border border-slate-200 mb-2 shadow-sm">
                            <span class="text-xs font-bold text-slate-700 pr-2">${escapeHTML(item.name)} <span class="text-sky-600 ml-0.5">(x${escapeHTML(item.qty)})</span></span>
                            ${badge}
                        </div>`;
            }).join('');

            // Xử lý hình ảnh
            const beforeList = order.images || [];
            let beforeImgs = beforeList.map(url => `<img src="${escapeHTML(url)}" onclick="openImageViewer('${escapeHTML(url)}')" class="w-full h-40 object-cover rounded-xl border border-slate-200 shadow-sm cursor-pointer hover:opacity-80 transition">`).join('');
            
            const afterList = (order.images_after || []).filter(url => url && url.trim() !== '');
            let afterImgs = afterList.map(url => `<img src="${escapeHTML(url)}" onclick="openImageViewer('${escapeHTML(url)}')" class="w-full h-40 object-cover rounded-xl border border-emerald-200 shadow-sm cursor-pointer hover:opacity-80 transition">`).join('');

            box.innerHTML = `
                <!-- Khối thông tin khách hàng -->
                <div class="space-y-3 bg-white p-5 rounded-2xl border border-slate-200 text-xs shadow-sm">
                    <div class="flex justify-between gap-4 border-b border-slate-100 pb-2"><span class="text-slate-500">Mã hóa đơn:</span><span class="font-mono font-bold text-slate-800">${escapeHTML(order.id)}</span></div>
                    <div class="flex justify-between gap-4"><span class="text-slate-500">Khách hàng:</span><span class="font-bold text-slate-800 uppercase text-right">${escapeHTML(order.customer_name)}</span></div>
                    <div class="flex justify-between gap-4"><span class="text-slate-500">Số điện thoại:</span><span class="font-mono font-bold text-sky-700 text-right">${maskedPhone}</span></div>
                    <div class="flex justify-between gap-4"><span class="text-slate-500">Ngày gửi:</span><span class="font-mono text-right text-slate-600">${escapeHTML(order.date)}</span></div>
                    <div class="flex justify-between pt-3 border-t border-slate-100"><span class="text-slate-500 font-bold mt-1">Tổng thanh toán:</span><span class="font-extrabold text-sky-600 text-lg">${formatMoney(order.total)}</span></div>
                </div>

                <!-- Lời nhắn nếu đã xong -->
                ${isCompleted ? `
                <div class="bg-gradient-to-r from-emerald-50 to-teal-50 border border-emerald-200 p-4 rounded-2xl text-center shadow-sm">
                    <p class="font-bold text-emerald-800 text-sm"><i class="fa-solid fa-gift mr-1"></i> Giày của bạn đã xong, mời bạn đến lấy nhé!</p>
                </div>` : ''}

                <!-- Khối tiến độ chung -->
                <div class="space-y-3">
                    <h3 class="font-bold text-[11px] uppercase text-slate-400 tracking-wider">Tiến Độ Xử Lý</h3>
                    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">${stepsHtml}</div>
                </div>

                <!-- Chi tiết từng dịch vụ -->
                <div class="space-y-3">
                    <h3 class="font-bold text-[11px] uppercase text-slate-400 tracking-wider">Chi Tiết Dịch Vụ</h3>
                    <div class="bg-transparent">${detailedItemsHtml}</div>
                </div>
                
                <!-- Hình ảnh đối chiếu -->
                <div class="space-y-4 pt-2">
                    <h3 class="font-bold text-[11px] uppercase text-slate-400 tracking-wider">Tình Trạng Giày</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div class="space-y-2">
                            <div class="text-xs font-bold text-slate-600 bg-slate-200/50 py-1.5 px-3 rounded-lg flex items-center gap-1.5 w-fit"><i class="fa-solid fa-camera"></i> Lúc Nhận (Before)</div>
                            <div class="grid grid-cols-2 gap-2">${beforeImgs || '<div class="col-span-2 text-slate-400 italic text-xs py-6 text-center bg-white rounded-xl border border-dashed border-slate-300">Chưa có ảnh trước</div>'}</div>
                        </div>
                        <div class="space-y-2">
                            <div class="text-xs font-bold text-emerald-700 bg-emerald-100/50 py-1.5 px-3 rounded-lg flex items-center gap-1.5 w-fit"><i class="fa-solid fa-wand-magic-sparkles"></i> Hoàn Thiện (After)</div>
                            <div class="grid grid-cols-2 gap-2">${afterImgs || '<div class="col-span-2 text-slate-400 italic text-xs py-6 text-center bg-white rounded-xl border border-dashed border-slate-300">Đang trong quá trình xử lý</div>'}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Khởi chạy khi load xong
        window.addEventListener('DOMContentLoaded', loadTrackingData);
    </script>
</body>
</html>
